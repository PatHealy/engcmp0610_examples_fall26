<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Movie4u.com</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
	<style>
		a{
			text-decoration:none;
		}
		h1{
			font-size:600%;
		}
		li{
			font-size: 300%;
		}

		.hidden{
			display:none;
		}
	</style>
</head>
<body>
	<div class="container d-flex justify-content-center align-items-center min-vh-100">
		<div class="w-100">
			<br/>
			<div class="row">
				<div class="col"></div>
				<div class="col-8 text-center">
					<section class="card bg-secondary">
						<div class="card-body">
							<h1 class="card-title">Fav Movies</h1>
						</div>
					</section>
				</div>
				<div class="col"></div>
			</div>
			<br/>
			<div class="row">
				<div class="col"></div>
				<div class="col-8">
					<ul id="movieList" class="list-group">
				  		<li id="emptyListLabel" class="list-group-item bg-secondary"> The movie list is empty!</li>
					</ul>

					<br>
					<form action="javascript:add_movie()">
					  <div class="mb-3">
					    <label for="newMovie" class="form-label">Movie to add:</label>
					    <input type="text" class="form-control" id="newMovie" name="newMovie">
					  </div>
					  <button type="submit" class="btn btn-primary">Submit</button>
					</form>
				</div>
				<div class="col"></div>
			</div>
			<br/>
		</div>
	</div>
	 <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
	 <script>

	 	function add_movie()
	 	{
	 		var movieInput = document.getElementById("newMovie");
	 		var movieName = movieInput.value;
	 		movieInput.value = "";

	 		//Find the empty list label by ID
		 	var emptyListLabel = document.getElementById("emptyListLabel");
		 	//Make it disappear
		 	emptyListLabel.classList.add("hidden");

		 	//Create a new list item
		 	var newMovie = document.createElement("li");
		 	//Give that item some text
		 	newMovie.textContent = movieName;
		 	//Add classes from bootstrap
		 	newMovie.classList.add("list-group-item");
		 	newMovie.classList.add("bg-secondary");
		 	//Find the list's parent
		 	var movieList = document.getElementById("movieList");
		 	//Add our new item to the list's parent
		 	movieList.append(newMovie);
	 	}
	 </script>
</body>
</html>
